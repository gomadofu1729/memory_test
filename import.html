<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードデータをインポート - めもりーくぇすちょねあ</title>
<script src="js/transit.js" defer></script>
<script src="js/export.js" defer></script>
<script src="js/storage.js" defer></script>
<script src="js/import.js" defer></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>カードデータをインポート</h1></header>
<main>
    <section data-section="1">
        <h2>1. カードセットを選択</h2>
        <label>
            <input type="radio" id="setMode-new" name="setMode" value="new">
            新しいセットを作成
        </label>
        <div id="under-setMode-new">
            <label for="new-set-id">セットID</label>
            <input type="text" id="new-set-id" placeholder="例: pref_office">
            <p id="set-id-error" class="error hide"></p>
        </div>
        <label>
            <input type="radio" id="setMode-existing" name="setMode" value="existing" class="wait">
            既存のセットに追加
        </label>
        <select id="existing-set">
            <option value="">既存セットを選択</option>
        </select>
        <button id="next1" class="wait">next &gt;</button>
    </section>

    <section data-section="2" class="hide vertical">
        <h2>2. カードデータを選択</h2>
        <select id="import-type">
            <option value="user-file">ファイルを選択</option>
            <option value="pref">sample: 都道府県庁住所</option>
        </select>
        <input type="file" class="wait2" id="select-file" accept=".csv,.tsv,.txt" >
        <p id="file-error" class="error hide"></p>
        <button id="next2" class="wait2">next &gt;</button>
    </section>

    <section data-section="3" class="hide">
        <h2>3. 確認</h2>
        <p id="last-error" class="error hide"></p>
        <button id="settle" class="wait3">確定</button>
    </section>
</main>
</body>
</html>
