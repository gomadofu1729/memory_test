</head>
<body>

<div id="file-port">
    <div>
        <button id="sample-import">サンプルデータを使用</button>

            <option value="">サンプルを選択</option>
            <option value="prefectureal_office">都道府県庁住所</option>
        </select>
    </div>
    <div>
        <button id="data-import">カードデータをインポート</button>
        <input type="file" id="fileInput" accept=".csv,.txt">
    </div>
    <div>
        <button id="history-import">学習履歴をインポート</button>
        <input type="file" id="fileInput" accept=".csv">
    </div>
    <div>
        <button id="export">学習履歴をエクスポート</button>
    </div>
</div>
<button id="start">開始</button>
</body>
