<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<title>めもりーくぇすちょねあ</title>
<script src="script.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>暗記</h1>
<table id="file-port">
    <tr>
        <td><button id="sample-import">サンプルデータを使用</button></td>
        <td>
            <select id="sample-list">
                <option value="">サンプルを選択</option>
                <option value="prefectureal_office">都道府県庁住所</option>
            </select>
        </td>
    </tr>
    <tr>
        <td><button id="data-import">カードデータをインポート</button></td>
        <td><input type="file" id="fileInput" accept=".csv,.txt"></td>
    </tr>
    <tr>
        <td><button id="history-import">学習履歴をインポート</button></td>
        <td><input type="file" id="fileInput" accept=".csv"></td>
    </tr>
    <tr>
        <td><button id="export">学習履歴をエクスポート</button></td>
    </tr>
</table>
<br>
<button id="start">開始</button>
</body>
