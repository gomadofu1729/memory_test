<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>めもりーくぇすちょねあ</title>
<script src="js/script.js" defer></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>めもりーくぇすちょねあ</h1></header>
<div id="file-port">
    <button id="cards-import">カードをインポート</button><br>
    <button id="set-import">カードセットをインポート</button>
    <input type="file" id="set-file" accept=".json" hidden>
</div>
<div>
    <select id="select-sets">
        <option value="">セットを選択</option>
    </select>
</div>
<div id="Main-buttons">
    <button id="cards-export">カードをエクスポート</button><br>
    <button id="set-export">カードセットをエクスポート</button><br>
    <button id="setting">設定</button><br>
    <button id="start">開始</button>
</div>
</body>
