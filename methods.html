<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出題方式の設定 - めもりーくぇすちょねあ</title>
<script src="js/transit.js" defer></script>
<script src="js/export.js" defer></script>
<script src="js/storage.js" defer></script>
<script src="js/methods.js" defer></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>出題方式</h1></header>
<h4 id="set-name"></h4>
<div id="buttons">
    <button id="confirm" class="wait">変更を保存</button>
    <button id="add">方式の追加</button>
    <button id="setting">設定画面に戻る</button>
</div>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>問題文</th>
            <th>出題フィールド</th>
            <th>解答フィールド</th>
        </tr>
    </thead>
    <tbody id="method-table"></tbody>
</table>
<div id="body-menu" class="pop-up">
    <p id="method-id">方式ID: </p>
    <p id="Qtext" class="when-free">問題文: </p>
    <div id="Qtext-div" class="when-editing">
        <label for="Qtext-input"></label>
        <input type="text" id="Qtext-input">
    </div>
    <button id="Qtext-edit" class="when-free">編集</button>
    <button id="Qtext-reset" class="when-free">元に戻す</button>
    <button id="Qtext-restore" class="when-editing">やめる</button>
    <button id="Qtext-confirm" class="when-editing">確定</button>
    <button id="method-delete" class="when-free">方式削除</button>
    <button id="method-undelete" class="when-deleted">方式削除取り消し</button>
</div>
</body>
