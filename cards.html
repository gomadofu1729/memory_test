<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードデータ - めもりーくぇすちょねあ</title>
<script src="js/transit.js" defer></script>
<script src="js/export.js" defer></script>
<script src="js/storage.js" defer></script>
<script src="js/cards.js" defer></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>カードデータ</h1></header>
<h4 id="set-name"></h4>
<table>
    <thead id="card-table-head">
        <tr id="head-row">
            <th>ID</th>
        </tr>
    </thead>
    <tbody id="card-table-body">
    </tbody>
</table>
<div id="buttons">
    <button id="confirm" class="wait">変更を保存</button>
    <button id="cards-import">カードをインポート</button>
    <button id="cards-export" class="wait">カードをエクスポート</button>
    <button id="setting">設定画面に戻る</button>
</div>
<div id="head-menu" class="pop-up">
    <p id="field-id">フィールドID: </p>
    <p id="field-name" class="when-free">表示名: </p>
    <div id="field-div" class="when-editing">
        <label for="field-input">表示名: </label>
        <input type="text" id="field-input">
    </div>
    <button id="field-edit" class="when-free">編集</button>
    <button id="field-reset" class="when-free">元に戻す</button>
    <button id="field-restore" class="when-editing">やめる</button>
    <button id="field-confirm" class="when-editing">確定</button>
    <button id="field-delete" class="when-free">削除</button>
    <button id="field-undelete" class="when-deleted">削除取り消し</button>
    <p>これから問う方式: </p>
    <div id="field-method-from"></div>
    <p>これを問われる方式: </p>
    <div id="field-method-to"></div>
</div>
<div id="body-menu" class="pop-up">
    <p id="card-id">カードID: </p>
    <p id="content-name" class="when-free"></p>
    <div id="content-div" class="when-editing">
        <label for="content-input" id="content-label"></label>
        <input type="text" id="content-input">
    </div>
    <button id="content-edit" class="when-free">編集</button>
    <button id="content-reset" class="when-free">元に戻す</button>
    <button id="content-restore" class="when-editing">やめる</button>
    <button id="content-confirm" class="when-editing">確定</button>
    <button id="card-delete" class="when-free">カード削除</button>
    <button id="card-undelete" class="when-deleted">カード削除取り消し</button>
    <button id="card-exclusion">除外設定</button>
</div>
</body>
