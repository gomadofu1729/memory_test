<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードセットの設定 - めもりーくぇすちょねあ</title>
<script src="set_setting.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>設定</h1></header>
<h3>基本データ</h3>
<div id="set-name">
    <p id="set-name-display">セット名: </p>
    <input type="text" id="set-name-edit" hidden>
</div>
<h3>カード</h3>
<div id="cards">
    <p id="cards-number"></p>
    <button id="cards-check">カードを閲覧</button><br>
    <button id="cards-export">カードをエクスポート</button>
</div>
<h3>出題方式</h3>
<div id="methods">
    <p id="methods-number"></p>
    <button id="methods-edit">出題方式を管理</button>
</div>
<h3>除外設定</h3>
<div id="exclusion">
    <p id="exclusion-number"></p>
    <button id="exclusion-edit">除外設定を管理</button>
</div>
<div id="buttons">
    <button id="history-export">カードセットをエクスポート</button><br>
    <button id="delete">カードセットを削除</button>
</div>
</body>
