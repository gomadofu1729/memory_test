<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードセットの設定 - めもりーくぇすちょねあ</title>
<script src="js/transit.js" defer></script>
<script src="js/export.js" defer></script>
<script src="js/storage.js" defer></script>
<script src="js/set_setting.js" defer></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>設定</h1></header>
<h3>基本情報</h3>
<div id="set-name" class="menu-free">
    <p id="set-name-display">セット名: </p>
    <div id="set-name-div" hidden>
        <label for="set-name-input">セット名: </label>
        <input type="text" id="set-name-input">
    </div>
    <button id="set-name-edit" class="wait when-free">編集</button>
    <button id="set-name-restore" class="when-editing">やめる</button>
    <button id="set-name-confirm" class="when-editing">確定</button>
</div>
<h3>カード</h3>
<div id="cards" class="vertical">
    <p id="cards-number">0件</p>
    <button id="cards-edit" class="wait">カードを管理</button>
    <button id="cards-import">カードをインポート</button>
    <button id="cards-export" class="wait">カードをエクスポート</button>
</div>
<h3>出題方式</h3>
<div id="methods" class="vertical">
    <p id="methods-number">0件</p>
    <button id="methods-edit">出題方式を管理</button>
</div>
<h3>除外設定</h3>
<div id="exclusion">
    <p id="exclusion-number">0件</p>
    <button id="exclusion-edit">除外設定を管理</button>
</div>
<h3>データ</h3>
<div id="buttons" class="vertical">
    <button id="set-export" class="wait">カードセットをエクスポート</button>
    <button id="delete">カードセットを削除</button>
</div>
<h4>他</h4>
<div id="transit" class="vertical">
    <button id="index">メニューに戻る</button>
    <button id="start">このセットで開始</button>
</div>
</body>
